<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#8B5CF6" />
<title>轻盈生活 · Light Living</title>
<style>
  :root{
    --primary:#8B5CF6;
    --primary-soft:#DDD6FE;
    --secondary:#93C5FD;
    --secondary-soft:#E0F2FE;
    --bg:#FAFAFE;
    --surface:#FFFFFF;
    --text-main:#1E1B4B;
    --text-sub:#6B7280;
    --line:#EEEDF7;
    --shadow:0 4px 20px -2px rgba(139,92,246,.05);
    --shadow-lg:0 12px 40px -8px rgba(139,92,246,.18);
    --radius:22px;
    --hero-g1:#E9E3FF;
    --hero-g2:#E0F2FE;
    --field-bg:#FBFBFE;
  }
  /* ===== 主题：竹杖（薄荷绿）===== */
  [data-theme="mint"]{
    --primary:#3fae8e;
    --primary-soft:#cdeede;
    --secondary:#7fd1b0;
    --secondary-soft:#e3f6ee;
    --bg:#eef9f3;
    --surface:#ffffff;
    --text-main:#16302a;
    --text-sub:#5a7a70;
    --line:#e0f0e8;
    --shadow:0 4px 20px -2px rgba(63,174,142,.06);
    --shadow-lg:0 12px 40px -8px rgba(63,174,142,.18);
    --hero-g1:#DDF3EA;
    --hero-g2:#E7F6F0;
    --field-bg:#f3fbf7;
  }
  /* ===== 主题：鸢尾（紫，默认）===== */
  [data-theme="purple"]{
    --primary:#8B5CF6;
    --primary-soft:#DDD6FE;
    --secondary:#93C5FD;
    --secondary-soft:#E0F2FE;
    --bg:#FAFAFE;
    --surface:#FFFFFF;
    --text-main:#1E1B4B;
    --text-sub:#6B7280;
    --line:#EEEDF7;
    --shadow:0 4px 20px -2px rgba(139,92,246,.05);
    --shadow-lg:0 12px 40px -8px rgba(139,92,246,.18);
    --hero-g1:#E9E3FF;
    --hero-g2:#E0F2FE;
    --field-bg:#FBFBFE;
  }
  /* ===== 主题：星夜（深色）===== */
  [data-theme="night"]{
    --primary:#6fd3b5;
    --primary-soft:#26403a;
    --secondary:#5bb6e0;
    --secondary-soft:#1f3a44;
    --bg:#11151a;
    --surface:#1b2228;
    --text-main:#e6efeb;
    --text-sub:#9fb2ad;
    --line:#27323a;
    --shadow:0 4px 20px -2px rgba(0,0,0,.4);
    --shadow-lg:0 12px 40px -8px rgba(0,0,0,.55);
    --hero-g1:#1c2a2c;
    --hero-g2:#16242b;
    --field-bg:#20282f;
  }
  [data-theme="night"] .ctx-cancel{background:#222b33;color:var(--text-sub);}
  [data-theme="night"] .seg{background:#222b33;}
  [data-theme="night"] .field input,[data-theme="night"] .field textarea,[data-theme="night"] .field select{background:var(--surface);}
  [data-theme="night"] .guide-body .tip{background:#1b2228;color:var(--text-sub);}
  [data-theme="night"] .guide-body code{background:#222b33;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text-main);
    -webkit-font-smoothing:antialiased;
    transition:background .3s;
  }
  .app{
    max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);
    position:relative;padding-bottom:120px;overflow-x:hidden;
  }

  /* ===== HERO ===== */
  .hero{
    position:relative;
    background:linear-gradient(135deg,var(--hero-g1) 0%,var(--hero-g2) 100%);
    padding:max(env(safe-area-inset-top),28px) 22px 54px;
    border-bottom-left-radius:30px;border-bottom-right-radius:30px;
  }
  .gear{position:absolute;top:max(env(safe-area-inset-top),28px);right:18px;width:36px;height:36px;border:0;background:rgba(255,255,255,.55);border-radius:50%;font-size:17px;cursor:pointer;color:var(--text-main);transition:.2s;display:flex;align-items:center;justify-content:center;}
  .gear:active{transform:scale(.9);}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--text-main);}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px rgba(139,92,246,.18);}
  .brand small{font-weight:500;font-size:12px;color:var(--text-sub);letter-spacing:.5px;}
  .hero-cost{margin-top:22px;}
  .hero-cost .label{font-size:13px;color:var(--text-sub);font-weight:500;}
  .hero-cost .amount{font-size:40px;font-weight:800;letter-spacing:-1px;color:var(--text-main);line-height:1.1;margin-top:2px;}
  .hero-cost .amount span{font-size:40px;}
  .hero-stats{display:flex;margin-top:20px;gap:6px;}
  .hero-stats .col{flex:1;text-align:center;background:rgba(255,255,255,.55);backdrop-filter:blur(6px);border-radius:16px;padding:12px 4px;}
  .hero-stats .col b{display:block;font-size:20px;font-weight:800;color:var(--text-main);}
  .hero-stats .col span{font-size:11px;color:#5b5b78;font-weight:500;}

  .lightness{
    margin:-34px 18px 0;background:var(--surface);border-radius:var(--radius);
    box-shadow:var(--shadow-lg);padding:18px;display:flex;align-items:center;gap:16px;
    position:relative;z-index:2;
  }
  .ring{
    --p:0;width:64px;height:64px;border-radius:50%;flex:0 0 auto;position:relative;
    background:conic-gradient(var(--primary) calc(var(--p)*1%),#EDE9FE 0);
    display:flex;align-items:center;justify-content:center;
  }
  .ring::before{content:"";position:absolute;width:50px;height:50px;border-radius:50%;background:var(--surface);}
  .ring b{position:relative;font-size:15px;font-weight:800;color:var(--primary);}
  .lightness .txt{font-size:13px;line-height:1.5;color:var(--text-main);}
  .lightness .txt small{color:var(--text-sub);}

  /* ===== TOOLBAR ===== */
  .tabs{display:flex;background:var(--surface);margin:18px 18px 0;border-radius:16px;padding:5px;box-shadow:var(--shadow);position:relative;}
  .tabs button{flex:1;border:0;background:transparent;font-size:14px;font-weight:600;color:var(--text-sub);padding:11px 0;border-radius:12px;transition:.25s;cursor:pointer;}
  .tabs button.on{background:linear-gradient(135deg,var(--primary),#A78BFA);color:#fff;box-shadow:0 6px 16px -4px rgba(139,92,246,.5);}

  .cats{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 4px;scrollbar-width:none;}
  .cats::-webkit-scrollbar{display:none;}
  .cats .pill{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--text-sub);font-size:12.5px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer;transition:.2s;white-space:nowrap;}
  .cats .pill.on{background:var(--primary-soft);border-color:var(--primary-soft);color:var(--primary);}

  .sortbar{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 10px;}
  .sortbar .count{font-size:12px;color:var(--text-sub);}
  .sortsel{position:relative;}
  .sortsel select{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text-main);font-size:12.5px;font-weight:600;padding:8px 30px 8px 14px;border-radius:999px;cursor:pointer;}
  .sortsel::after{content:"▾";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--primary);font-size:12px;pointer-events:none;}

  /* ===== SEARCH ===== */
  .searchbar{position:relative;padding:6px 18px 4px;}
  .searchbar input{flex:1;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 44px 11px 16px;font-size:13.5px;color:var(--text-main);outline:none;transition:.2s;font-family:inherit;}
  .searchbar input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(139,92,246,.12);}
  .searchbar .clr{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;background:var(--line);border-radius:50%;color:var(--text-sub);cursor:pointer;font-size:13px;display:none;align-items:center;justify-content:center;}
  .searchbar .clr:active{transform:translateY(-50%) scale(.9);}
  .list.noanim .card{animation:none;}

  /* ===== LIST / CARD ===== */
  .list{padding:6px 18px 10px;display:flex;flex-direction:column;gap:14px;}
  .card{
    background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:14px;display:flex;gap:14px;position:relative;align-items:flex-start;
    animation:fadeUp .42s cubic-bezier(.22,1,.36,1) both;
    transition:transform .12s ease;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .thumb{width:84px;height:84px;border-radius:18px;flex:0 0 auto;object-fit:cover;background:linear-gradient(135deg,var(--primary-soft),var(--secondary-soft));display:flex;align-items:center;justify-content:center;font-size:30px;}
  .card .body{flex:1;min-width:0;}
  .card .name{font-size:16px;font-weight:700;color:var(--text-main);display:flex;align-items:center;gap:8px;}
  .cat-pill{font-size:10.5px;font-weight:700;color:var(--primary);background:var(--primary-soft);padding:3px 9px;border-radius:999px;}
  .card .meta{font-size:12.5px;color:var(--text-sub);margin-top:7px;display:flex;flex-wrap:wrap;gap:4px 12px;}
  .card .meta b{color:var(--text-main);font-weight:700;}
  .card .cost{font-size:13px;color:var(--text-sub);margin-top:5px;}
  .card .cost b{font-size:18px;color:var(--primary);font-weight:800;}
  .card .note{font-size:12px;color:#9aa0b4;margin-top:7px;font-style:italic;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .status-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;margin-top:9px;}
  .archived-tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:#64748b;background:#EEF2F7;padding:4px 9px;border-radius:999px;margin-top:9px;}
  .farewell-note{font-size:12.5px;color:#7c8196;margin-top:9px;line-height:1.55;background:#F7F6FC;border-radius:10px;padding:9px 11px;}

  .menu-btn{position:absolute;top:10px;right:10px;width:30px;height:30px;border:0;background:transparent;color:var(--text-sub);font-size:20px;line-height:1;border-radius:50%;cursor:pointer;transition:.2s;}
  .menu-btn:active{transform:scale(.9);background:var(--line);}

  .checkin{position:absolute;right:14px;bottom:14px;width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;
    background:linear-gradient(135deg,var(--primary),#A78BFA);color:#fff;font-size:20px;font-weight:700;
    box-shadow:0 8px 18px -4px rgba(139,92,246,.55);transition:transform .12s;}
  .checkin:active{transform:scale(.9);}
  .checkin.pop{animation:pop .4s ease;}
  @keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.22);}100%{transform:scale(1);}}

  .arch-actions{display:flex;gap:10px;margin-top:12px;}
  .arch-actions button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--text-sub);font-size:12.5px;font-weight:600;padding:9px 0;border-radius:12px;cursor:pointer;transition:.2s;}
  .arch-actions button:active{transform:scale(.97);}
  .arch-actions .restore{color:var(--primary);border-color:var(--primary-soft);background:var(--primary-soft);}

  .empty{text-align:center;color:var(--text-sub);padding:60px 30px;}
  .empty .em{font-size:46px;}
  .empty p{margin:14px 0 0;font-size:14px;line-height:1.6;}

  /* ===== FAB ===== */
  .fab{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 22px);
    width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;
    background:linear-gradient(135deg,var(--primary),#7C6FF0);color:#fff;font-size:30px;font-weight:300;
    box-shadow:0 14px 30px -6px rgba(139,92,246,.6);z-index:30;transition:transform .15s;
    display:flex;align-items:center;justify-content:center;
  }
  .fab:active{transform:translateX(-50%) scale(.92);}

  /* ===== MODAL ===== */
  .overlay{position:fixed;inset:0;background:rgba(30,27,75,.42);backdrop-filter:blur(3px);z-index:40;
    display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .28s;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .sheet{width:100%;max-width:480px;background:var(--surface);border-top-left-radius:28px;border-top-right-radius:28px;
    padding:22px 22px calc(env(safe-area-inset-bottom) + 26px);transform:translateY(100%);transition:transform .32s cubic-bezier(.22,1,.36,1);max-height:92vh;overflow-y:auto;}
  .overlay.show .sheet{transform:translateY(0);}
  .ctx-sheet{max-width:420px;padding:14px 14px calc(env(safe-area-inset-bottom) + 16px);}
  .ctx-handle{width:38px;height:4px;border-radius:999px;background:#E5E1F5;margin:2px auto 12px;}
  .ctx-item{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--text-main);font-size:16px;font-weight:600;padding:15px 14px;border-radius:14px;cursor:pointer;transition:background .15s;}
  .ctx-item:active{background:var(--primary-soft);}
  .ctx-cancel{width:100%;border:0;background:#F1EEFB;color:var(--text-sub);font-size:14px;font-weight:600;padding:13px 0;border-radius:14px;margin-top:8px;cursor:pointer;}
  .confetti{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;}
  .confetti span{position:absolute;top:64%;animation:floatUp 1.5s ease-out forwards;opacity:0;will-change:transform,opacity;}
  @keyframes floatUp{0%{transform:translateY(0) scale(.6) rotate(0);opacity:0;}12%{opacity:1;}100%{transform:translateY(-72vh) scale(1.15) rotate(20deg);opacity:0;}}
  .card.pressing{transform:scale(.97);}
  .sheet h3{margin:0 0 4px;font-size:19px;font-weight:800;color:var(--text-main);}
  .sheet .sub{font-size:13px;color:var(--text-sub);margin-bottom:18px;line-height:1.5;}

  /* ===== SETTINGS MENU ROWS ===== */
  .menu-row{display:flex;align-items:center;width:100%;text-align:left;border:0;background:transparent;color:var(--text-main);font-size:15.5px;font-weight:600;padding:15px 14px;border-radius:14px;cursor:pointer;transition:background .15s;gap:12px;}
  .menu-row:active{background:var(--primary-soft);}
  .menu-row .mr-ico{font-size:20px;width:26px;text-align:center;flex:0 0 auto;}
  .menu-row .mr-tx{flex:1;min-width:0;}
  .menu-row .mr-ar{color:#c7c3e0;font-size:20px;flex:0 0 auto;}

  /* ===== 设置：主题 / 语言 ===== */
  .settings-block{margin:6px 0 4px;}
  .sb-label{font-size:12.5px;font-weight:700;color:var(--text-sub);margin:10px 4px 8px;letter-spacing:.3px;}
  .theme-row{display:flex;gap:8px;}
  .theme-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--text-main);font-size:13.5px;font-weight:600;padding:11px 4px;border-radius:14px;cursor:pointer;transition:.2s;}
  .theme-btn:active{transform:scale(.97);}
  .theme-btn.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);}
  .theme-btn .tdot{width:13px;height:13px;border-radius:50%;flex:0 0 auto;}
  .lang-row{display:flex;gap:8px;}
  .lang-btn{flex:1;border:1.5px solid var(--line);background:var(--surface);color:var(--text-sub);font-size:14px;font-weight:600;padding:11px 0;border-radius:14px;cursor:pointer;transition:.2s;}
  .lang-btn:active{transform:scale(.97);}
  .lang-btn.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);}

  /* ===== CATEGORY / AUTOBACKUP LISTS ===== */
  .field-wrap{margin:14px 0 6px;}
  .field-wrap .field{width:100%;}
  .row{display:flex;gap:10px;margin-top:6px;}
  .row .btn-primary,.row .btn-ghost{margin-top:0;}
  .cat-item{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:14px;background:var(--surface);margin-bottom:10px;}
  .cat-item .cat-name{flex:1;font-size:15px;font-weight:600;color:var(--text-main);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cat-item .cat-act{border:0;background:var(--primary-soft);color:var(--primary);font-size:13px;font-weight:700;padding:7px 12px;border-radius:10px;cursor:pointer;}
  .cat-item .cat-act.del{background:#FBE9EC;color:#E24B4A;}
  .bak-item{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:14px;background:var(--surface);margin-bottom:10px;}
  .bak-item .bak-info{flex:1;min-width:0;}
  .bak-item .bak-ts{font-size:14px;font-weight:600;color:var(--text-main);}
  .bak-item .bak-meta{font-size:12px;color:var(--text-sub);margin-top:2px;}
  .bak-item .cat-act.del{background:#FBE9EC;color:#E24B4A;}
  .empty-tip{font-size:13px;color:var(--text-sub);text-align:center;padding:22px 0;}

  /* ===== GUIDE BODY ===== */
  .guide-body{max-height:62vh;overflow-y:auto;margin-bottom:14px;-webkit-overflow-scrolling:touch;}
  .guide-body h4{margin:18px 0 6px;font-size:15px;font-weight:800;color:var(--text-main);}
  .guide-body h4:first-child{margin-top:0;}
  .guide-body p{margin:0 0 8px;font-size:13.5px;line-height:1.65;color:var(--text-sub);}
  .guide-body ul{margin:0 0 8px;padding-left:20px;}
  .guide-body li{font-size:13.5px;line-height:1.6;color:var(--text-sub);margin-bottom:4px;}
  .guide-body b{color:var(--text-main);font-weight:700;}
  .guide-body table{width:100%;border-collapse:collapse;margin:0 0 8px;font-size:12.5px;}
  .guide-body th,.guide-body td{border:1px solid var(--line);padding:7px 9px;text-align:left;color:var(--text-sub);vertical-align:top;}
  .guide-body th{background:var(--primary-soft);color:var(--primary);font-weight:700;}
  .guide-body code{background:#F1EEFB;padding:1px 6px;border-radius:6px;font-size:12px;color:var(--primary);}
  .guide-body .tip{background:#F7F6FC;border-radius:12px;padding:10px 12px;margin:0 0 10px;font-size:13px;color:#7c8196;line-height:1.6;}

  .field{margin-bottom:15px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--text-main);margin-bottom:7px;}
  .field input,.field textarea,.field select{
    width:100%;border:1px solid var(--line);background:#FBFBFE;border-radius:14px;padding:13px 14px;
    font-size:15px;color:var(--text-main);font-family:inherit;outline:none;transition:.2s;
  }
  .field input[type=color]{padding:6px;height:46px;}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(139,92,246,.12);}
  .field textarea{resize:none;min-height:64px;}
  .row2{display:flex;gap:12px;}
  .row2 .field{flex:1;}

  .seg{display:flex;background:#F3F1FB;border-radius:14px;padding:4px;gap:4px;}
  .seg button{flex:1;border:0;background:transparent;font-size:14px;font-weight:600;color:var(--text-sub);padding:11px 0;border-radius:11px;cursor:pointer;transition:.22s;}
  .seg button.on{background:var(--surface);color:var(--primary);box-shadow:0 2px 8px -2px rgba(139,92,246,.25);}

  .upload{border:1.5px dashed var(--primary-soft);border-radius:16px;padding:14px;text-align:center;cursor:pointer;color:var(--text-sub);font-size:13px;transition:.2s;position:relative;overflow:hidden;}
  .upload:active{transform:scale(.99);}
  .upload img{width:100%;max-height:160px;border-radius:12px;object-fit:cover;display:block;}
  .upload .ph{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0;}
  .upload .ph .ic{font-size:26px;}

  .reasons{display:flex;flex-direction:column;gap:10px;margin:8px 0 16px;}
  .reasons label{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:14px;padding:14px;font-size:14.5px;font-weight:600;color:var(--text-main);cursor:pointer;transition:.2s;}
  .reasons label.on{border-color:var(--primary);background:var(--primary-soft);}
  .reasons input{accent-color:var(--primary);width:18px;height:18px;}

  .btn-primary{width:100%;border:0;background:linear-gradient(135deg,var(--primary),#7C6FF0);color:#fff;font-size:16px;font-weight:700;padding:15px 0;border-radius:16px;cursor:pointer;box-shadow:0 10px 24px -6px rgba(139,92,246,.5);transition:transform .12s;}
  .btn-primary:active{transform:scale(.98);}
  .btn-ghost{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text-sub);font-size:15px;font-weight:600;padding:14px 0;border-radius:16px;cursor:pointer;margin-top:10px;transition:transform .12s;}
  .btn-ghost:active{transform:scale(.98);}

  .farewell-card{background:linear-gradient(135deg,#F5F1FF,#EAF4FF);border-radius:20px;padding:22px;text-align:center;margin-bottom:6px;}
  .farewell-card .heart{font-size:34px;}
  .farewell-card .msg{font-size:15px;line-height:1.6;color:var(--text-main);margin-top:8px;font-weight:600;}

  /* status management */
  .status-card{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;}
  .status-card .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;}
  .status-card .info{flex:1;min-width:0;}
  .status-card .info b{font-size:14px;color:var(--text-main);}
  .status-card .info small{display:block;color:var(--text-sub);font-size:11.5px;margin-top:3px;line-height:1.45;}
  .status-card .ops{display:flex;flex-direction:column;gap:5px;flex:0 0 auto;}
  .status-card .ops button{border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:11px;padding:5px 9px;cursor:pointer;color:var(--text-sub);transition:.15s;}
  .status-card .ops button:active{transform:scale(.94);}
  .cond-row{display:flex;gap:6px;align-items:center;margin-bottom:8px;}
  .cond-row select,.cond-row input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;background:#FBFBFE;font-family:inherit;color:var(--text-main);}
  .cond-row .c-del{flex:0 0 auto;width:34px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;color:var(--text-sub);cursor:pointer;font-size:14px;}
  .cond-row .c-del:active{transform:scale(.92);}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%) translateY(20px);
    background:rgba(30,27,75,.92);color:#fff;font-size:13.5px;font-weight:600;padding:12px 20px;border-radius:999px;z-index:60;
    opacity:0;pointer-events:none;transition:.3s;white-space:nowrap;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ===== reminder ===== */
  .reminder{margin:14px 18px 0;background:linear-gradient(135deg,#FFF4F4,#FDEEF0);border:1px solid #FAD7DC;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
  .rem-head{display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:800;color:#b91c4b;}
  .rem-ignore-all{border:0;background:transparent;color:#b91c4b;font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;padding:2px 4px;}
  .rem-body{font-size:12.5px;color:#9b5a6a;line-height:1.5;margin:8px 0 12px;}
  .rem-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(255,255,255,.72);border-radius:14px;padding:10px 12px;margin-bottom:8px;}
  .rem-item b{font-size:14px;color:var(--text-main);}
  .rem-item small{display:block;font-size:11px;color:#9b5a6a;margin-top:2px;}
  .rem-btns{display:flex;gap:8px;flex:0 0 auto;}
  .rem-farewell{border:0;background:linear-gradient(135deg,var(--primary),#A78BFA);color:#fff;font-size:12px;font-weight:700;padding:8px 12px;border-radius:10px;cursor:pointer;}
  .rem-farewell:active{transform:scale(.96);}
  .rem-ignore{border:1px solid #FAD7DC;background:transparent;color:#b91c4b;font-size:12px;font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer;}
  .rem-ignore:active{transform:scale(.96);}

  /* ===== thumb editable / emoji / pager ===== */
  .thumb{cursor:pointer;transition:transform .15s;position:relative;}
  .thumb:active{transform:scale(.96);}
  .thumb .edit-hint{position:absolute;right:3px;bottom:3px;font-size:10px;background:rgba(30,27,75,.55);color:#fff;border-radius:6px;padding:1px 4px;line-height:1.2;}
  .emoji-row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  .emoji-row .chip{flex:0 0 auto;width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-size:20px;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;padding:0;}
  .emoji-row .chip:active{transform:scale(.92);}
  .emoji-row .chip.on{border-color:var(--primary);background:var(--primary-soft);}
  .emoji-row input{flex:1;min-width:90px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:15px;font-family:inherit;color:var(--text-main);outline:none;}
  .emoji-row input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(139,92,246,.12);}
  .pager{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 0 6px;}
  .pager .pg{border:1px solid var(--line);background:var(--surface);color:var(--text-main);font-size:13px;font-weight:600;padding:9px 18px;border-radius:999px;cursor:pointer;transition:.15s;}
  .pager .pg:active{transform:scale(.96);}
  .pager .pg:disabled{opacity:.4;cursor:default;}
  .pager .pg-info{font-size:13px;color:var(--text-sub);font-weight:600;}
  /* ===== 底部主题诗句 ===== */
  .poem-foot{text-align:center;padding:30px 40px 40px;margin-top:6px;}
  .poem-foot .poem{font-size:15px;font-weight:600;color:var(--primary);letter-spacing:.5px;line-height:1.7;font-family:"Songti SC","STSong",serif;}
  .poem-foot .poem-en{font-size:12px;color:var(--text-sub);margin-top:6px;line-height:1.6;font-style:italic;}
</style>
</head>

  function t(k,vars){
    let s;
    if(I18N[lang]&&I18N[lang][k]!=null)s=I18N[lang][k];
    else if(I18N.zh[k]!=null)s=I18N.zh[k];
    else s=k;
    if(vars){for(const key in vars){s=String(s).replace(new RegExp('\\{'+key+'\\}','g'),vars[key]);}}
    return s;
  }
  function applyI18n(root){
    const r=root||document;
    r.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.getAttribute('data-i18n'));});
    r.querySelectorAll('[data-i18n-ph]').forEach(function(el){el.setAttribute('placeholder',t(el.getAttribute('data-i18n-ph')));});
    document.documentElement.lang=(lang==='zh')?'zh-CN':'en';
  }
  function setLang(l){
    lang=l;
    try{localStorage.setItem(LANG_KEY,l);}catch(e){}
    applyI18n();renderGuide();render();refreshSettingsSelection();
  }
  function applyTheme(){
    document.documentElement.setAttribute('data-theme',theme);
    const meta=document.querySelector('meta[name="theme-color"]');
    if(meta)meta.setAttribute('content',THEMES[theme].dot);
  }
  function setTheme(key){
    theme=key;
    try{localStorage.setItem(THEME_KEY,key);}catch(e){}
    applyTheme();
    const row=document.getElementById('themeRow');
    if(row)row.querySelectorAll('.theme-btn').forEach(function(b){b.classList.toggle('on',b.dataset.theme===theme);});
  }

  /* ---------- storage ---------- */
  function load(){
    try{const th=localStorage.getItem(THEME_KEY);if(th&&THEMES[th])theme=th;}catch(e){}
    try{const lg=localStorage.getItem(LANG_KEY);if(lg==='en'||lg==='zh')lang=lg;}catch(e){}
    try{state.items=JSON.parse(localStorage.getItem(STORE_KEY))||[];}catch(e){state.items=[];}
    try{state.statuses=JSON.parse(localStorage.getItem(STATUS_KEY))||[];}catch(e){state.statuses=[];}
    try{categories=JSON.parse(localStorage.getItem(CAT_KEY))||[];}catch(e){categories=[];}
    if(categories.length===0){categories=DEFAULT_CATS.slice();localStorage.setItem(CAT_KEY,JSON.stringify(categories));}
    try{dismissed=JSON.parse(localStorage.getItem(REMIND_KEY))||[];}catch(e){dismissed=[];}
    if(!localStorage.getItem(SEED_FLAG)&&state.items.length===0){
      state.items=seed();localStorage.setItem(SEED_FLAG,'1');save();
    }
    if(state.statuses.length===0){state.statuses=defaultStatuses();saveStatuses();}
    migrateSamples();
    migrateEmoji();
  }
  function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state.items));autoBackup();}
  function saveStatuses(){localStorage.setItem(STATUS_KEY,JSON.stringify(state.statuses));autoBackup();}
  function autoBackup(){
    try{
      const list=JSON.parse(localStorage.getItem(AUTOBAK_KEY))||[];
      list.push({ts:Date.now(),items:state.items,statuses:state.statuses});
      while(list.length>5)list.shift();
      localStorage.setItem(AUTOBAK_KEY,JSON.stringify(list));
    }catch(e){}
  }

  function exportBackup(){
    const s=new Date();
    const pad=n=>String(n).padStart(2,'0');
    const fn='light-living-备份-'+s.getFullYear()+pad(s.getMonth()+1)+pad(s.getDate())+'-'+pad(s.getHours())+pad(s.getMinutes())+'.json';
    const data={app:'light-living',version:1,exportedAt:s.toISOString(),items:state.items,statuses:state.statuses};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=fn;
    document.body.appendChild(a);a.click();a.remove();
    URL.revokeObjectURL(url);
    toast(t('exportToast'));
  }
  function importBackup(file){
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const data=JSON.parse(e.target.result);
        if(!data||!Array.isArray(data.items))throw new Error('格式不符');
        askConfirm(t('importConfirm'),()=>{
          state.items=data.items;
          if(Array.isArray(data.statuses))state.statuses=data.statuses;
          save();saveStatuses();closeOverlay('settingsOverlay');render();renderStatusList?.();
          toast(t('importToast'));
        },t('importTitle'));
      }catch(err){toast(t('importInvalid'));}
    };
    reader.readAsText(file);
  }

  /* ---------- calc ---------- */
  function daysSince(dateStr){
    const d=new Date(dateStr+'T00:00:00');const now=new Date();
    return Math.max(0,Math.floor((now-d)/86400000));
  }
  function companionDays(it){return daysSince(it.purchaseDate)+1;}
  function perDay(it){return it.price/companionDays(it);}
  function perUse(it){return it.useCount>0?it.price/it.useCount:Infinity;}
  function unitCost(it){return it.mode==='count'?perUse(it):perDay(it);}
  function cmpCost(a,b,desc){
    const x=unitCost(a),y=unitCost(b);
    const infX=!isFinite(x),infY=!isFinite(y);
    if(infX&&infY)return 0;
    if(infX)return desc?-1:1;
    if(infY)return desc?1:-1;
    return desc?y-x:x-y;
  }
  function unseenDays(it){return it.mode==='day'?0:daysSince(it.lastCheckin||it.purchaseDate);}

  function metricValue(it,m){
    if(m==='unit')return unitCost(it);
    if(m==='days')return companionDays(it);
    if(m==='count')return it.useCount;
    if(m==='idle')return it.mode==='count'?unseenDays(it):0;
    return 0;
  }
  function compare(v,op,t){t=Number(t);return op==='lte'?v<=t:op==='gte'?v>=t:op==='lt'?v<t:v>t;}

  function evalStatus(it){
    for(const st of state.statuses){
      if(st.applyTo!=='all'&&st.applyTo!==it.mode)continue;
      const cs=st.conditions;if(!cs||cs.length===0)continue;
      let ok=st.match==='all';
      for(const c of cs){
        const r=compare(metricValue(it,c.metric),c.op,c.value);
        if(st.match==='all'){if(!r){ok=false;break;}}
        else{if(r)ok=true;}
      }
      if(ok)return st;
    }
    return NEUTRAL;
  }

  /* ---------- helpers ---------- */
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function money(n){if(!isFinite(n))return '∞';return '¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function moneyShort(n){if(!isFinite(n))return '∞';return '¥'+Number(n).toLocaleString('zh-CN',{maximumFractionDigits:0});}

  /* ---------- derived ---------- */
  function visible(){
    let arr=state.items.filter(it=>it.status===(state.tab==='active'?'active':'archived'));
    if(state.category!=='全部')arr=arr.filter(it=>it.category===state.category);
    if(state.search){
      const q=state.search.toLowerCase();
      arr=arr.filter(it=>(it.name||'').toLowerCase().includes(q)||(it.note||'').toLowerCase().includes(q));
    }
    const by={
      cost_desc:(a,b)=>cmpCost(a,b,true),
      cost_asc:(a,b)=>cmpCost(a,b,false),
      date_desc:(a,b)=>new Date(b.purchaseDate)-new Date(a.purchaseDate),
      unseen_desc:(a,b)=>unseenDays(b)-unseenDays(a)
    };
    arr.sort(by[state.sort]||by.cost_desc);
    return arr;
  }
  function heroStats(){
    const active=state.items.filter(it=>it.status==='active');
    let finiteDaily=0,hasInfinite=false;
    active.forEach(it=>{const c=unitCost(it);if(!isFinite(c))hasInfinite=true;else finiteDaily+=c;});
    const asset=active.reduce((s,it)=>s+it.price,0);
    const archived=state.items.filter(it=>it.status==='archived').length;
    const positive=active.filter(it=>evalStatus(it).positive).length;
    const negative=active.filter(it=>{const s=evalStatus(it);return !s.positive&&s.id!=='neutral';}).length;
    const score=active.length?Math.round(positive/active.length*100):0;
    return {finiteDaily,hasInfinite,asset,archived,count:active.length,score,positive,negative};
  }
  function insight(s){
    if(s.count===0)return t('insightEmpty');
    if(s.score>=70)return t('insightGreat');
    if(s.score>=40)return t('insightGood');
    if(s.negative>0)return t('insightNeg');
    return t('insightSlow');
  }

    });

  let toastT;

  function vibrate(ms){if(navigator.vibrate)try{navigator.vibrate(ms);}catch(e){}}
  let _audioCtx;
  function playChime(){
    try{
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      _audioCtx=_audioCtx||new AC();
      if(_audioCtx.state==='suspended')_audioCtx.resume();
      const now=_audioCtx.currentTime;
      const notes=[523.25,659.25,783.99,1046.5];
      notes.forEach((f,i)=>{
        const o=_audioCtx.createOscillator(),g=_audioCtx.createGain();
        o.type='triangle';o.frequency.value=f;
        const t=now+i*0.12;
        g.gain.setValueAtTime(0.0001,t);
        g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
        o.connect(g).connect(_audioCtx.destination);
        o.start(t);o.stop(t+0.45);
      });
    }catch(e){}
  }
  function celebrate(){
    if(document.querySelector('.confetti'))return;
    const wrap=document.createElement('div');wrap.className='confetti';
    const emojis=['🎉','✨','💜','🌟','🎊'];
    for(let i=0;i<16;i++){
      const s=document.createElement('span');
      s.textContent=emojis[i%emojis.length];
      s.style.left=(Math.random()*94+3)+'%';
      s.style.animationDelay=(Math.random()*0.35)+'s';
      s.style.fontSize=(14+Math.random()*18)+'px';
      wrap.appendChild(s);
    }
    document.body.appendChild(wrap);
    setTimeout(()=>wrap.remove(),1800);
  }

  /* ---------- overlay ---------- */
  let histActive=false;
  function openOverlay(id){
    const el=document.getElementById(id);if(!el)return;
    el.classList.add('show');
    if(overlayStack.indexOf(id)<0)overlayStack.push(id);
    if(!histActive){histActive=true;try{history.pushState({llOverlay:true},'');}catch(e){}}
  }
  function closeOverlay(id){
    const idx=overlayStack.indexOf(id);
    if(idx<0){const el=document.getElementById(id);if(el)el.classList.remove('show');return;}
    overlayStack.splice(idx).forEach(x=>{const el=document.getElementById(x);if(el)el.classList.remove('show');});
    if(overlayStack.length===0&&histActive){histActive=false;try{history.back();}catch(e){}}
  }
  function swapOverlay(fromId,toId){
    const from=document.getElementById(fromId);if(from)from.classList.remove('show');
    const fi=overlayStack.indexOf(fromId);if(fi>=0)overlayStack.splice(fi,1);
    openOverlay(toId);
  }
  window.addEventListener('popstate',function(){
    if(overlayStack.length){
      const id=overlayStack.pop();
      const el=document.getElementById(id);if(el)el.classList.remove('show');
      if(overlayStack.length===0)histActive=false;
    }
  });

  function compressImage(file,cb){
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const max=1000;let w=img.width,h=img.height;
        if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}
        const c=document.createElement('canvas');c.width=w;c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        cb(c.toDataURL('image/jpeg',0.72));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function submitForm(){
    const name=document.getElementById('f_name').value.trim();
    const price=parseFloat(document.getElementById('f_price').value);
    const date=document.getElementById('f_date').value;
    const cat=document.getElementById('f_cat').value;
    const note=document.getElementById('f_note').value.trim();
    if(!name){toast(t('nameRequired'));return;}
    if(isNaN(price)||price<0){toast(t('priceInvalid'));return;}
    if(!date){toast(t('dateRequired'));return;}
    if(editingId){
      const it=state.items.find(x=>x.id===editingId);
      if(it){
        it.name=name;it.price=price;it.purchaseDate=date;it.category=cat;
        it.mode=formMode;it.note=note;
        it.image=newImage!=null?newImage:it.image;
        if(formMode==='count'&&(typeof it.useCount!=='number'||it.useCount<0))it.useCount=0;
        save();
      }
      closeOverlay('addOverlay');render();toast(t('updated'));vibrate(20);
    }else{
      const item={
        id:'it_'+Date.now(),name,price,purchaseDate:date,category:cat,mode:formMode,
        useCount:formMode==='count'?0:1,lastCheckin:null,image:newImage||'',note,status:'active',archiveReason:'',farewellNote:''
      };
      state.items.unshift(item);save();closeOverlay('addOverlay');render();toast(t('added'));vibrate(20);
    }
  }

    if(used>0){
      const rest=categories.filter((_,i)=>i!==idx);
      askConfirm(t('catDelConfirm',{n:used,name:name,fb:rest[0]||'其他'}),()=>{
        const fallback=rest[0];
        state.items.forEach(it=>{if(it.category===name)it.category=fallback;});
        categories.splice(idx,1);saveCats();save();renderCatsList();render();toast(t('catDeletedReassign'));

    it.status='active';it.archiveReason='';it.farewellNote='';save();render();toast(t('welcomeBack'));
  }
  function actDel(id){
    askConfirm(t('delConfirm'),()=>{
      state.items=state.items.filter(x=>x.id!==id);save();render();toast(t('deleted'));
    },t('delTitle'));
  }

  /* ---------- events ---------- */
  document.getElementById('app').addEventListener('click',e=>{
    const t=e.target.closest('[data-act],[data-tab],[data-cat],#gearBtn');if(!t)return;
    if(t.id==='gearBtn'){openSettings();return;}
    if(t.dataset.tab){state.tab=t.dataset.tab;state.page=1;render();return;}
    if(t.dataset.cat){state.category=t.dataset.cat;state.page=1;render();return;}
    const act=t.dataset.act,id=t.dataset.id;
    if(act==='page'){const np=+t.dataset.page;if(np>=1){state.page=np;render();}return;}
    if(act==='edit'){actEdit(id);return;}
    if(act==='checkin'){
      const it=state.items.find(x=>x.id===id);if(!it)return;
      it.useCount++;it.lastCheckin=new Date().toISOString().slice(0,10);save();render();
      const btn=document.querySelector('.checkin[data-id="'+id+'"]');
      if(btn){btn.classList.add('pop');setTimeout(()=>btn.classList.remove('pop'),420);}
      toast(t('checkinToast'));vibrate(15);
    }else if(act==='farewell'){actFarewell(id);}
    else if(act==='restore'){actRestore(id);}
    else if(act==='ignore'){
      if(!dismissed.includes(id))dismissed.push(id);
      localStorage.setItem(REMIND_KEY,JSON.stringify(dismissed));render();
    }else if(act==='ignoreAll'){
      negativeItems().forEach(it=>{if(!dismissed.includes(it.id))dismissed.push(it.id);});
      localStorage.setItem(REMIND_KEY,JSON.stringify(dismissed));render();toast(t('ignoredAll'));
    }else if(act==='del'){actDel(id);}
  });

  /* ---------- settings menu ---------- */
  document.getElementById('settingsOverlay').addEventListener('click',e=>{
    const th=e.target.closest('.theme-btn');
    if(th){setTheme(th.dataset.theme);return;}
    const lg=e.target.closest('.lang-btn');
    if(lg){setLang(lg.dataset.lang);return;}
    const r=e.target.closest('[data-set]');if(!r)return;
    const k=r.dataset.set;
    if(k==='rules'){renderStatusList();swapOverlay('settingsOverlay','statusOverlay');}
    else if(k==='guide'){swapOverlay('settingsOverlay','guideOverlay');}
    else if(k==='cats'){renderCatsList();swapOverlay('settingsOverlay','catsOverlay');}
    else if(k==='data'){renderAutoBak();swapOverlay('settingsOverlay','dataBakOverlay');}
  });

  /* ---------- long press / context menu ---------- */
  function openCtx(id){
    const it=state.items.find(x=>x.id===id);if(!it)return;
    const menu=document.getElementById('ctxMenu');
    const items=it.status==='active'
      ?[[t('ctxEdit'),'edit',id],[t('ctxFarewell'),'farewell',id],[t('ctxDel'),'del',id]]
      :[[t('ctxEdit'),'edit',id],[t('ctxRestore'),'restore',id],[t('ctxDel'),'del',id]];
    menu.innerHTML=items.map(([label,a,iid])=>`<button class="ctx-item" data-ctx="${a}" data-id="${iid}">${label}</button>`).join('');
    openOverlay('ctxOverlay');
  }
  document.getElementById('ctxMenu').addEventListener('click',e=>{
    const b=e.target.closest('[data-ctx]');if(!b)return;
    const act=b.dataset.ctx,id=b.dataset.id;closeOverlay('ctxOverlay');
    if(act==='edit')actEdit(id);
    else if(act==='farewell')actFarewell(id);
    else if(act==='restore')actRestore(id);
    else if(act==='del')actDel(id);
  });
  (function(){
    const appEl=document.getElementById('app');
    let lpTimer=null;
    function clear(){if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}}
    function press(card,on){if(card)card.classList.toggle('pressing',on);}
    appEl.addEventListener('touchstart',e=>{
      const card=e.target.closest('.card');if(!card||!card.dataset.id)return;
      press(card,true);clear();lpTimer=setTimeout(()=>{lpTimer=null;press(card,false);openCtx(card.dataset.id);},480);
    },{passive:true});
    appEl.addEventListener('touchmove',()=>{clear();appEl.querySelectorAll('.card.pressing').forEach(c=>c.classList.remove('pressing'));},{passive:true});
    appEl.addEventListener('touchend',()=>{clear();appEl.querySelectorAll('.card.pressing').forEach(c=>c.classList.remove('pressing'));},{passive:true});
    appEl.addEventListener('touchcancel',()=>{clear();appEl.querySelectorAll('.card.pressing').forEach(c=>c.classList.remove('pressing'));},{passive:true});
    appEl.addEventListener('contextmenu',e=>{
      const card=e.target.closest('.card');if(!card||!card.dataset.id)return;
      e.preventDefault();openCtx(card.dataset.id);
    });
  })();

  document.getElementById('app').addEventListener('change',e=>{
    if(e.target.id==='sortSel'){state.sort=e.target.value;state.page=1;render();}
  });
  document.getElementById('app').addEventListener('input',e=>{
    if(e.target.id==='searchInput'){state.search=e.target.value;state.page=1;updateList();}
  });
  document.getElementById('app').addEventListener('click',e=>{
    if(e.target.id==='searchClear'){
      const inp=document.getElementById('searchInput');
      if(inp){inp.value='';state.search='';state.page=1;updateList();inp.focus();}
    }
  });

  document.getElementById('fab').addEventListener('click',openAdd);
  document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeOverlay(b.dataset.close)));
  document.getElementById('confirmYes').addEventListener('click',()=>{const cb=confirmCb;confirmCb=null;closeOverlay('confirmOverlay');if(cb)cb();});
  document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeOverlay(o.id);}));

  document.querySelectorAll('#f_mode button').forEach(b=>b.addEventListener('click',()=>{
    formMode=b.dataset.m;
    document.querySelectorAll('#f_mode button').forEach(x=>x.classList.toggle('on',x===b));
  }));

  document.getElementById('f_upload').addEventListener('click',()=>document.getElementById('f_file').click());
  document.getElementById('f_file').addEventListener('change',e=>{
    const f=e.target.files[0];if(!f)return;
    compressImage(f,data=>{newImage=data;document.getElementById('f_emoji').value='';updateImagePreview();});
  });
  document.getElementById('f_emojiRow').addEventListener('click',e=>{
    const chip=e.target.closest('.chip');if(!chip)return;
    newImage=chip.dataset.emoji;
    document.getElementById('f_emoji').value=newImage;
    updateImagePreview();
  });
  document.getElementById('f_emoji').addEventListener('input',e=>{
    const v=e.target.value.trim();
    newImage=v?v:null;
    updateImagePreview();
  });
  document.getElementById('f_submit').addEventListener('click',submitForm);

  document.querySelectorAll('#reasons label').forEach(l=>l.addEventListener('click',()=>{
    document.querySelectorAll('#reasons label').forEach(x=>x.classList.remove('on'));
    l.classList.add('on');const inp=l.querySelector('input');if(inp)inp.checked=true;
  }));
  document.getElementById('farewellConfirm').addEventListener('click',confirmFarewell);

  /* status mgmt events */
  document.getElementById('addStatus').addEventListener('click',()=>openStatusEdit(null));
  document.getElementById('exportBtn').addEventListener('click',exportBackup);
  document.getElementById('addCat').addEventListener('click',()=>openCatEdit(null));
  document.getElementById('catSave').addEventListener('click',saveCat);
  document.getElementById('catsList').addEventListener('click',e=>{
    const ed=e.target.closest('[data-cat-edit]');const del=e.target.closest('[data-cat-del]');
    if(ed){openCatEdit(+ed.dataset.catEdit);return;}
    if(del){deleteCat(+del.dataset.catDel);return;}
  });
  document.getElementById('autoBakList').addEventListener('click',e=>{
    const r=e.target.closest('[data-bak-restore]');if(r)restoreAutoBak(r.dataset.bakRestore);
  });
  document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;importBackup(f);e.target.value='';});
  document.getElementById('statusList').addEventListener('click',e=>{
    const ed=e.target.closest('[data-se-edit]');
    const del=e.target.closest('[data-se-del]');
    const up=e.target.closest('[data-se-up]');
    const down=e.target.closest('[data-se-down]');
    if(ed){openStatusEdit(ed.dataset.seEdit);return;}
    if(del){const id=del.dataset.seDel;state.statuses=state.statuses.filter(x=>x.id!==id);saveStatuses();renderStatusList();render();toast('已删除状态');return;}
    if(up){const i=state.statuses.findIndex(x=>x.id===up.dataset.seUp);if(i>0){const t=state.statuses[i];state.statuses[i]=state.statuses[i-1];state.statuses[i-1]=t;saveStatuses();renderStatusList();render();}return;}
    if(down){const i=state.statuses.findIndex(x=>x.id===down.dataset.seDown);if(i>=0&&i<state.statuses.length-1){const t=state.statuses[i];state.statuses[i]=state.statuses[i+1];state.statuses[i+1]=t;saveStatuses();renderStatusList();render();}return;}
  });

  document.getElementById('se_name').addEventListener('input',e=>editingStatus.name=e.target.value);
  document.getElementById('se_emoji').addEventListener('input',e=>editingStatus.emoji=e.target.value);
  document.getElementById('se_color').addEventListener('input',e=>editingStatus.color=e.target.value);
  document.getElementById('se_apply').addEventListener('change',e=>editingStatus.applyTo=e.target.value);
  document.querySelectorAll('#se_pos button').forEach(b=>b.addEventListener('click',()=>{
    editingStatus.positive=b.dataset.p==='1';
    document.querySelectorAll('#se_pos button').forEach(x=>x.classList.toggle('on',x===b));
  }));
  document.querySelectorAll('#se_match button').forEach(b=>b.addEventListener('click',()=>{
    editingStatus.match=b.dataset.m;
    document.querySelectorAll('#se_match button').forEach(x=>x.classList.toggle('on',x===b));
  }));
  document.getElementById('se_addCond').addEventListener('click',()=>{
    if(!editingStatus.conditions)editingStatus.conditions=[];
    editingStatus.conditions.push({metric:'unit',op:'lte',value:0});renderCondEditor();
  });
  document.getElementById('se_conds').addEventListener('change',e=>{
    const row=e.target.closest('.cond-row');if(!row)return;const i=+row.dataset.i;const c=editingStatus.conditions[i];
    if(e.target.classList.contains('c-metric'))c.metric=e.target.value;
    else if(e.target.classList.contains('c-op'))c.op=e.target.value;
    else if(e.target.classList.contains('c-val'))c.value=e.target.value;
  });
  document.getElementById('se_conds').addEventListener('click',e=>{
    const del=e.target.closest('.c-del');if(!del)return;
    const i=+del.dataset.del;editingStatus.conditions.splice(i,1);renderCondEditor();
  });
  document.getElementById('se_save').addEventListener('click',saveStatusEdit);

  /* ---------- init ---------- */
  load();applyTheme();applyI18n();renderGuide();render();
})();
</script>
</body>
</html>
